<head>

<meta name="referrer" content="strict-origin-when-cross-origin">

<title>みてまなぶ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --ground:#EEF5FF; --ink:#1F2A44; --sub:#475569; --line:#CBD5E1;
  --blue:#2563EB; --blue-soft:#DBEAFE; --blue-deep:#1E3A8A;
  --orange:#EA6A0C; --orange-soft:#FFEDE0; --orange-deep:#9A3F00; --star:#F5B300;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:1100px;margin:0 auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:24px;font-weight:800;line-height:1.3}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 18px;font-size:20px;font-weight:800;flex-shrink:0}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#1B2235}
#yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;font-weight:800;min-height:52px;padding:0 22px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-white{background:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-red{background:#C2410C;color:#fff}
.btn-soft{background:var(--ground);color:var(--blue-deep)}
.btn-line{background:#fff;border:3px solid var(--line);color:#334155}
.track{flex:1 1 300px;height:14px;border-radius:999px;background:#D3E0F5;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--blue)}
.mark{position:absolute;top:-5px;width:24px;height:24px;margin-left:-12px;border-radius:999px;background:#fff;border:3px solid var(--orange)}
.mark.done{background:var(--orange);border-color:#fff}
.next{font-size:17px;font-weight:800;color:var(--orange-deep);background:#fff;border-radius:999px;padding:12px 18px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay[hidden]{display:none}
.card{width:min(860px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:30px;padding:30px 36px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.badge{background:var(--orange);color:#fff;font-size:18px;font-weight:800;padding:7px 18px;border-radius:999px}
.kind{background:var(--ground);color:var(--blue-deep);font-size:15px;font-weight:800;padding:7px 14px;border-radius:999px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:22px;height:22px;border-radius:999px;border:3px solid var(--blue);background:#fff}
.dot.on{background:var(--blue)}
.q{font-size:30px;font-weight:800;line-height:1.35;margin:0}
.ja{font-size:18px;font-weight:700;color:var(--sub);margin:4px 0 0}
.prompt{text-align:center;background:#F8FAFC;border-radius:20px;padding:16px;font-size:28px;font-weight:800;color:#334155}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border-radius:14px;padding:8px 16px;font-size:24px;font-weight:800}
.chip.ok{background:var(--blue-soft);color:var(--blue-deep)}
.chip.ng{background:var(--orange-soft);color:var(--orange-deep);text-decoration:underline wavy}
.heard{text-align:center;font-size:16px;font-weight:700;color:var(--sub)}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{width:150px;height:150px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(240,122,26,.16)}
.ring.on{background:rgba(37,99,235,.22);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ring.on{animation:none}}
.mic{width:118px;height:118px;border-radius:999px;border:0;background:var(--orange);display:flex;align-items:center;justify-content:center}
.ring.on .mic{background:var(--blue)}
.mic-text{font-size:19px;font-weight:800;text-align:center}
.mic-text.warn{color:var(--orange-deep)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choice{min-height:82px;border-radius:22px;border:4px solid var(--line);background:#F8FAFC;font-size:23px;font-weight:800;padding:8px 14px}
.choice.ok{border-color:var(--blue);background:var(--blue-soft)}
.choice.ng{border-color:#EA580C;background:var(--orange-soft)}
.choice.dim{opacity:.45}
.slots{min-height:74px;border-radius:20px;border:3px dashed var(--line);background:#F8FAFC;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.slots.full{border-color:var(--blue)}
.slot{min-width:60px;height:48px;border-radius:14px;background:#E9EEF5;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 14px}
.slot.f{background:#DCE7FB}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{height:56px;border-radius:16px;border:3px solid #93B4F0;background:#fff;font-size:22px;font-weight:800;padding:0 18px}
.tile.used{opacity:.25}
.msg{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:18px;padding:12px 12px 12px 20px;font-size:20px;font-weight:800;flex-wrap:wrap}
.msg.ok{background:var(--blue-soft);color:var(--blue-deep)}
.msg.ng{background:var(--orange-soft);color:var(--orange-deep)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.big{font-size:38px;font-weight:800;margin:0}
.cliptag{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 24px;font-size:18px;font-weight:800;z-index:9}
.cliptag[hidden]{display:none}
@media (max-width:700px){.q{font-size:24px}.grid2{grid-template-columns:1fr}.card{padding:22px}}
.stage-row{display:flex;align-items:center;justify-content:center;gap:36px;flex-wrap:wrap;padding:8px 0}
.round{border:0;border-radius:999px;display:flex;align-items:center;justify-content:center}
.round.speak{width:120px;height:120px;background:var(--blue)}
.round.scene{width:96px;height:96px;background:#fff;border:4px solid var(--orange)}
.round.go{width:120px;height:120px;background:var(--orange)}
.icon-label{font-size:15px;font-weight:800;color:var(--sub);text-align:center;margin-top:6px}
.result{display:flex;justify-content:center;min-height:96px;align-items:center}
.parent{border-top:2px dashed var(--line);padding-top:10px;font-size:14px;font-weight:700;color:var(--sub);line-height:1.6}
.ring.wait{opacity:.35}
.count{font-size:64px;font-weight:800;color:#fff;line-height:1}
.heard-big{text-align:center;font-size:30px;font-weight:800;color:var(--blue-deep);background:var(--blue-soft);border-radius:20px;padding:14px 20px;line-height:1.35}
</style>
</head>

  const heardBlock = () => {
    if (c.heard === null || c.listening) return '';
    let b = '<div class="heard-big" lang="en">' + (c.heard ? '“' + esc(c.heard) + '”' : '…') + '</div>';
    if (c.recUrl) b += '<div class="row" style="justify-content:center"><div><button class="round scene" data-act="myvoice" aria-label="じぶんの こえを きく" style="border-color:#2563EB">' + ICON.myvoice + '</button><div class="icon-label">じぶんの こえ</div></div></div>';
    return b;
  };

  if (c.status === 'right' || c.status === 'done') {
    if (c.status === 'right') h += '<div class="result">' + ICON.ok + '</div>';
    h += heardBlock();
    h += '<div class="row" style="justify-content:center"><div><button class="round go" data-act="next" aria-label="つぎへ"' + (busy ? ' disabled style="opacity:.5"' : '') + '>' + ICON.next + '</button><div class="icon-label">つぎへ</div></div></div>';
  } else {
    h += '<div class="stage-row">';
    h += '<div><button class="round speak" data-act="listen" aria-label="もういちど きく"' + (busy ? ' disabled style="opacity:.5"' : '') + '>' + ICON.speak + '</button><div class="icon-label">きく</div></div>';
    h += '<div><div class="ring' + (c.listening && c.micOpen ? ' on' : '') + (busy ? ' wait' : '') + '"><button class="mic" data-act="mic" aria-label="はなす"' + (busy ? ' disabled' : '') + '>' +
      (c.listening && c.count > 0 ? '<span class="count">' + c.count + '</span>' : ICON.mic) + '</button></div><div class="icon-label">はなす</div></div>';
    if (ask && c.tries > 0 && !c.sawScene) {
      h += '<div><button class="round scene" data-act="scene" aria-label="ばめんを みる"' + (busy ? ' disabled style="opacity:.5"' : '') + '>' + ICON.scene + '</button><div class="icon-label">みる</div></div>';
    }
    h += '</div>';
    h += heardBlock();
  }

  if (PARENT) {
    h += '<div class="parent">' + (ask ? 'Q: ' + esc(q.q) + '<br>' : '') +
      (q.kind === 'repeat' || c.follow ? 'まねする文: ' + esc(c.follow ? q.text : q.text) + '<br>' : '') +
      (q.model ? 'おてほん: ' + esc(q.model) + '<br>' : '') +
      (c.heard !== null ? 'きこえた: ' + esc(c.heard || '（なし）') + '<br>' : '') +
      (c.listening ? 'きいてる: ' + esc(liveText || '…') + '<br>' : '') +
      (lastErr ? 'エラー: ' + esc(lastErr) + '<br>' : '') +
      (evLog.length ? 'きろく: ' + esc(evLog.join(' → ')) + '<br>' : '') +
      'ためした: ' + c.tries + (c.sawScene ? '（ばめんを みた）' : '') + (q.again ? '（まえに こたえられなかった もんだい）' : '') + '</div>';
  }
  show(h);
}

// ---------- 判定 ----------
function judge(alts) {
  const c = quiz.cur, q = c.q, ask = q.kind === 'ask' && !c.follow;
  c.tries++;
  if (ask) {
    c.heard = alts[0] || '';
    return alts.some(a => { const hw = ' ' + words(a).join(' ') + ' '; return q.accept.some(x => hw.includes(' ' + words(x).join(' ') + ' ')); });
  }
  const target = words(q.text);
  let bestN = -1, bestA = '';
  (alts.length ? alts : ['']).forEach(a => {
    const hw = words(a); let p = 0, n = 0;
    target.forEach(t => { const k = hw.indexOf(t, p); if (k >= 0) { p = k + 1; n++; } });
    if (n > bestN) { bestN = n; bestA = a; }
  });
  c.heard = bestA;
  return bestN / target.length >= PASS_RATIO;
}

async function afterAnswer(pass) {
  const c = quiz.cur, q = c.q, ask = q.kind === 'ask' && !c.follow;
  busy = true;
  if (pass) {
    c.status = 'right';
    const counts = !c.follow && !(ask && c.sawScene);
    if (counts) { quiz.good++; addStar(); }
    render();
    await playSfx('ok');
    await speak(pick(CHEER) + (ask && q.model ? ' ' + q.model : ''));
    busy = false; render();
    return;
  }
  const max = ask ? MAX_ASK : MAX_REPEAT;
  if (c.tries < max) {
    render();
    await playSfx('retry');
    await speak(pick(RETRY));
    busy = false; render();
    if (!ask && !c.follow) playClip('intro');
    return;
  }
  if (!ask) {                                   // まねして いう は ダメでも先へ
    c.status = 'done'; render();
    await speak('Good try! Nice speaking!');
    busy = false; render();
    return;
  }
  // 質問に答えられなかった：場面を見て、おてほんを まねする。次のクイズで もういちど きく
  const p = loadPending(); p.push({ videoId: DATA.videoId, q }); savePending(p);
  await playSfx('retry');
  await speak("Let's watch it again!");
  busy = false;
  playClip('model');
}

// 声が入らなかった（マイクの不調・話すのが早すぎた など）ときは、回数に数えずにやり直し
async function noInput() {
  busy = true; render();
  quiz.cur.heard = '';
  await speak("Oops, I can't hear you! Say it again!");
  busy = false; render();
}

function goNext() {
  if (quiz.good >= quiz.goal) clearScreen(); else nextQuestion();
}

const COUNT_MS = 700;           // カウントダウン 1つぶんの長さ
// 3「プッ」→ 2「プッ」→ 1（音なし）→ 青く光る。
// 音が録音に入ったり iPad の聞き取りが止まったりしないよう、マイクは 2 の音が鳴りおわってから開く
async function countdown(c, onBeepsDone) {
  let told = false;
  const tell = () => { if (!told) { told = true; onBeepsDone && onBeepsDone(); } };
  for (let n = 3; n >= 1; n--) {
    if (!c.listening) { tell(); return; }
    c.count = n; render();
    if (n >= 2) playSfx('beep');
    if (n === 2) { await sleep(250); tell(); await sleep(COUNT_MS - 250); }
    else await sleep(COUNT_MS);
  }
  tell();
  c.count = 0;
  if (c.listening) { c.micOpen = true; logEv('どうぞ'); render(); }
}

async function startListening() {
  const c = quiz.cur;
  if (c.recUrl) { try { URL.revokeObjectURL(c.recUrl); } catch (e) {} c.recUrl = null; }
  speechSynthesis.cancel();
  lastErr = ''; liveText = ''; evLog = []; evT0 = Date.now();
  c.micOpen = false;
  c.count = 3;                  // 3・2・1 のカウントダウン中に マイクの準備をすませる
  rec = new SR();
  rec.lang = 'en-US';
  rec.continuous = true;        // iPad は 1回きりモードだと すぐ切れることがあるので、つづけて聞く
  rec.interimResults = true;    // とちゅうの結果も受けとる（iPad は最後の結果が来ないことがある）
  let got = [], silence = null, denied = false, stopped = false, recorder = null;
  const stopSoon = ms => { clearTimeout(silence); silence = setTimeout(() => { if (rec && !stopped) { stopped = true; rec.stop(); } }, ms); };
  const hardStop = setTimeout(() => { if (rec && !stopped) { stopped = true; rec.stop(); } }, 9000);
  // マイクが本当に聞きはじめたら、青く光らせる（音は鳴らさない）
  const markOpen = () => { c.audioReady = true; };   // iPad が聞きはじめた（青く光るのは カウントダウンのあと）
  const opened = name => { logEv(name); markOpen(); };
  rec.onstart = () => logEv('start');
  rec.onaudiostart = () => opened('マイク ON');
  rec.onsoundstart = () => opened('音を検知');
  rec.onspeechstart = () => opened('声を検知');
  rec.onspeechend = () => logEv('声 おわり');
  rec.onresult = e => {
    logEv('結果');
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    liveText = t.trim();
    got = liveText ? [liveText] : [];
    if (PARENT) render();
    stopSoon(c.micOpen ? 1500 : 1500 + COUNT_MS);   // 話しおわって 1.5秒 しずかなら 終わり（カウント中は待つ）
  };
  rec.onerror = e => {
    lastErr = e.error || 'unknown';
    logEv('エラー ' + lastErr);
    if (lastErr === 'not-allowed' || lastErr === 'service-not-allowed' || lastErr === 'audio-capture') denied = true;
  };
  rec.onend = async () => {
    logEv('end');
    clearTimeout(silence); clearTimeout(hardStop);
    rec = null;
    c.recUrl = await stopRecorder(recorder);
    c.listening = false;
    if (denied) {
      show('<div class="center"><p class="big">マイクが つかえません</p><p class="ja">' +
        (lastErr === 'service-not-allowed'
          ? 'iPad の せってい → 一般 → キーボード →「音声入力」を オンにしてね。'
          : 'iPad の せってい → アプリ → Safari → マイク を「許可」にして、ページを ひらきなおしてね。') +
        '（' + esc(lastErr) + '）</p><button class="btn btn-blue" data-act="back">もどる</button></div>');
      return;
    }
    if (!got.length || !got[0].trim()) { noInput(); return; }
    afterAnswer(judge(got));
  };
  c.listening = true;
  render();
  await new Promise(r => countdown(c, r));   // 画面に 3 → 2 → 1 → 青く光る（プッ・プッ が鳴りおわるまで待つ）
  if (!c.listening) { rec = null; return; }
  recorder = RECORD ? await startRecorder() : null;   // 自分の声も いっしょに録音
  setTimeout(() => {            // マイクを開く
    try {
      rec.start(); stopSoon(6000 + COUNT_MS);   // カウントダウン後 6秒 なにも聞こえなければ 終わり
    }
    catch (e) { lastErr = 'start-failed'; c.listening = false; rec = null; stopRecorder(recorder); render(); }
  }, 30);
}

// ---------- 動画の場面を流す ----------
function playClip(after) {
  const q = quiz.cur.q;
  clip = { start: q.clip_start, end: q.clip_end, after, seen: false, at: Date.now() };
  mode = 'clip'; hide();
  player.seekTo(clip.start, true);
  player.playVideo();
}
async function endClip() {
  if (!clip) return;
  player.pauseVideo();
  $('cliptag').hidden = true;
  mode = 'quiz';
  const after = clip.after; clip = null;
  const c = quiz.cur;
  if (after === 'intro') { render(); return; }
  if (after === 'scene') { c.sawScene = true; busy = true; render(); await speak(c.q.q); busy = false; render(); return; }
  if (after === 'model') {
    const f = fresh({ kind: 'repeat', text: c.q.model, clip_start: c.q.clip_start, clip_end: c.q.clip_end });
    f.follow = true;
    quiz.cur = f;
    busy = true; render();
    await speak('Say it with me. ' + c.q.model);
    busy = false; render();
  }
}

function clearScreen() {
  const m = $('mk' + bi); if (m) m.classList.add('done');
  show('<div class="center"><div class="row" style="justify-content:center">' + ICON.ok.repeat(3) + '</div>' +
    '<button class="round go" data-act="resume" aria-label="つづきを みる" style="width:150px;height:150px">' + ICON.play + '</button></div>');
  speak('You did it! Let\u2019s keep watching!');
}
function endScreen() {
  mode = 'end';
  show('<div class="center"><div class="row" style="justify-content:center">' + ICON.ok + '</div><p class="big">' + stars + '</p>' +
    '<button class="round go" data-act="again" aria-label="さいしょから みる">' + ICON.play + '</button></div>');
  speak('The end! Great watching!');
}

// ---------- ボタン ----------
$('card').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.disabled) return;
  const c = quiz && quiz.cur;
  switch (btn.dataset.act) {
    case 'start':
      if (!ready) return;
      unlockAudio();
      speak("Let's watch!");                     // 最初のタップで 読み上げと効果音を有効にする（iPad の決まり）
      hide(); mode = 'watch'; player.playVideo(); break;
    case 'listen':
      if (c.q.kind === 'repeat' && !c.follow) playClip('intro');
      else { busy = true; render(); speak(c.follow ? c.q.text : c.q.q).then(() => { busy = false; render(); }); }
      break;
    case 'mic':
      if (c.status) return;
      if (c.listening) { if (rec) rec.stop(); } else startListening();
      break;
    case 'scene': playClip('scene'); break;
    case 'myvoice':
      if (c && c.recUrl) { speechSynthesis.cancel(); voicePlayer.src = c.recUrl; voicePlayer.volume = 1; voicePlayer.play().catch(() => {}); }
      break;
    case 'next': if (!busy) goNext(); break;
    case 'back': render(); break;
    case 'resume':
      speechSynthesis.cancel();
      bi++; mode = 'watch'; hide();
      if (player.getPlayerState() === 0 || player.getCurrentTime() >= player.getDuration() - 0.5) {
        if (DATA.breaks[bi]) openQuiz(DATA.breaks[bi]); else endScreen();
      } else player.playVideo();
      break;
    case 'again':
      speechSynthesis.cancel();
      bi = 0; mode = 'watch'; hide();
      document.querySelectorAll('.mark.done').forEach(m => m.classList.remove('done'));
      player.seekTo(0, true); player.playVideo(); break;
  }
});
</script>
