<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みてまなぶ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --ground:#EEF5FF; --ink:#1F2A44; --sub:#475569; --line:#CBD5E1;
  --blue:#2563EB; --blue-soft:#DBEAFE; --blue-deep:#1E3A8A;
  --orange:#EA6A0C; --orange-soft:#FFEDE0; --orange-deep:#9A3F00; --star:#F5B300;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:1100px;margin:0 auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:24px;font-weight:800;line-height:1.3}
.pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:8px 18px;font-size:20px;font-weight:800;flex-shrink:0}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#1B2235}
#yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;font-weight:800;min-height:52px;padding:0 22px;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-white{background:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-red{background:#C2410C;color:#fff}
.btn-soft{background:var(--ground);color:var(--blue-deep)}
.btn-line{background:#fff;border:3px solid var(--line);color:#334155}
.track{flex:1 1 300px;height:14px;border-radius:999px;background:#D3E0F5;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--blue)}
.mark{position:absolute;top:-5px;width:24px;height:24px;margin-left:-12px;border-radius:999px;background:#fff;border:3px solid var(--orange)}
.mark.done{background:var(--orange);border-color:#fff}
.next{font-size:17px;font-weight:800;color:var(--orange-deep);background:#fff;border-radius:999px;padding:12px 18px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay[hidden]{display:none}
.card{width:min(860px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:30px;padding:30px 36px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.badge{background:var(--orange);color:#fff;font-size:18px;font-weight:800;padding:7px 18px;border-radius:999px}
.kind{background:var(--ground);color:var(--blue-deep);font-size:15px;font-weight:800;padding:7px 14px;border-radius:999px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:22px;height:22px;border-radius:999px;border:3px solid var(--blue);background:#fff}
.dot.on{background:var(--blue)}
.q{font-size:30px;font-weight:800;line-height:1.35;margin:0}
.ja{font-size:18px;font-weight:700;color:var(--sub);margin:4px 0 0}
.prompt{text-align:center;background:#F8FAFC;border-radius:20px;padding:16px;font-size:28px;font-weight:800;color:#334155}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border-radius:14px;padding:8px 16px;font-size:24px;font-weight:800}
.chip.ok{background:var(--blue-soft);color:var(--blue-deep)}
.chip.ng{background:var(--orange-soft);color:var(--orange-deep);text-decoration:underline wavy}
.heard{text-align:center;font-size:16px;font-weight:700;color:var(--sub)}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring{width:150px;height:150px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:rgba(240,122,26,.16)}
.ring.on{background:rgba(37,99,235,.22);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ring.on{animation:none}}
.mic{width:118px;height:118px;border-radius:999px;border:0;background:var(--orange);display:flex;align-items:center;justify-content:center}
.ring.on .mic{background:var(--blue)}
.mic-text{font-size:19px;font-weight:800;text-align:center}
.mic-text.warn{color:var(--orange-deep)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choice{min-height:82px;border-radius:22px;border:4px solid var(--line);background:#F8FAFC;font-size:23px;font-weight:800;padding:8px 14px}
.choice.ok{border-color:var(--blue);background:var(--blue-soft)}
.choice.ng{border-color:#EA580C;background:var(--orange-soft)}
.choice.dim{opacity:.45}
.slots{min-height:74px;border-radius:20px;border:3px dashed var(--line);background:#F8FAFC;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.slots.full{border-color:var(--blue)}
.slot{min-width:60px;height:48px;border-radius:14px;background:#E9EEF5;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 14px}
.slot.f{background:#DCE7FB}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{height:56px;border-radius:16px;border:3px solid #93B4F0;background:#fff;font-size:22px;font-weight:800;padding:0 18px}
.tile.used{opacity:.25}
.msg{display:flex;align-items:center;justify-content:space-between;gap:14px;border-radius:18px;padding:12px 12px 12px 20px;font-size:20px;font-weight:800;flex-wrap:wrap}
.msg.ok{background:var(--blue-soft);color:var(--blue-deep)}
.msg.ng{background:var(--orange-soft);color:var(--orange-deep)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.big{font-size:38px;font-weight:800;margin:0}
.cliptag{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 24px;font-size:18px;font-weight:800;z-index:9}
.cliptag[hidden]{display:none}
@media (max-width:700px){.q{font-size:24px}.grid2{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">みてまなぶ</h1>
    <div class="pill" aria-label="あつめた ほし">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#F5B300"/></svg>
      <span id="stars">0</span>
    </div>
  </header>
  <div class="stage"><div id="yt"></div><div class="shield" id="shield"></div></div>
  <div class="bar">
    <button class="btn btn-white" id="playBtn" aria-label="さいせい">
      <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
    </button>
    <button class="btn btn-white" id="backBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      10びょう もどる
    </button>
    <div class="track"><div class="fill" id="fill"></div><div id="marks"></div></div>
    <div class="next" id="next">じゅんびちゅう…</div>
  </div>
</div>
<div class="overlay" id="ov"><div class="card" id="card"></div></div>
<div class="cliptag" id="cliptag" hidden>もんだいの ところを さいせい中…</div>

<script>
const DATA = {"videoId": "0gD-biH2gRE", "title": "B1 English Listening - 🌳Terraria", "goal": 5, "breaks": [{"time": 302.9, "questions": [{"kind": "repeat", "q": "Say this sentence.", "ja": "どうぞ いってみよう。", "clip_start": 27.0, "clip_end": 35.0, "text": "I'm going to name my character Kenzo"}, {"kind": "answer", "q": "What color is the hair?", "ja": "かみのけは なにいろ?", "clip_start": 50.5, "clip_end": 62.0, "accept": ["blue", "bright blue", "blu"]}, {"kind": "answer", "q": "What color are the eyes?", "ja": "めは なにいろ?", "clip_start": 65.3, "clip_end": 75.1, "accept": ["red", "read"]}, {"kind": "repeat", "q": "Say this sentence.", "ja": "このせかいを いってみよう。", "clip_start": 104.2, "clip_end": 111.3, "text": "I'll name this world English world"}, {"kind": "answer", "q": "What is the name of the person in the forest?", "ja": "もりの ひとの なまえは?", "clip_start": 136.3, "clip_end": 148.0, "accept": ["colin", "collin", "colon", "kolin"]}, {"kind": "mc", "q": "What color are the pants?", "ja": "ズボンは なにいろ?", "clip_start": 73.6, "clip_end": 85.0, "choices": ["Dark brown", "Bright blue", "Red", "Green"], "answer": 0}, {"kind": "order", "q": "Put the words in order.", "ja": "ならべかえてね。", "clip_start": 120.3, "clip_end": 127.0, "text": "I want this world to be big"}, {"kind": "answer", "q": "What came out of the rock?", "ja": "いわから なにが でてきた?", "clip_start": 217.1, "clip_end": 226.3, "accept": ["worm", "a worm", "warm"]}, {"kind": "mc", "q": "What did Kenzo kill with his sword?", "ja": "ケンゾーは けんで なにを たおした?", "clip_start": 253.5, "clip_end": 267.0, "choices": ["A slime", "A worm", "A squirrel", "A sunflower"], "answer": 0}]}, {"time": 606.9, "questions": [{"kind": "repeat", "q": "Say this sentence.", "ja": "このぶんをいってみよう。", "clip_start": 341.0, "clip_end": 350.0, "text": "Now I'll craft a workbench."}, {"kind": "repeat", "q": "Say this sentence.", "ja": "このぶんをいってみよう。", "clip_start": 448.3, "clip_end": 456.0, "text": "There's a worm in the house."}, {"kind": "answer", "q": "What is on the roof?", "ja": "やねのうえに なにがいますか?", "clip_start": 377.0, "clip_end": 389.0, "accept": ["slime", "a slime", "slime on the roof", "slimes"]}, {"kind": "answer", "q": "What does the zombie hold?", "ja": "ゾンビは なにを もっていますか?", "clip_start": 579.5, "clip_end": 590.0, "accept": ["torch", "a torch", "torches"]}, {"kind": "answer", "q": "What fell from the sky?", "ja": "そらから なにが おちましたか?", "clip_start": 567.7, "clip_end": 580.0, "accept": ["star", "a star", "stars", "fallen star", "fallen stars", "a fallen star"]}, {"kind": "mc", "q": "What does the NPC room need?", "ja": "NPCの へやには なにが ひつようですか?", "clip_start": 467.9, "clip_end": 482.0, "choices": ["a table, a chair, and light", "a bed, a sword, and a star", "a door, a rock, and a worm", "a tree, a bunny, and a hammer"], "answer": 0}, {"kind": "mc", "q": "What can the wooden hammer break?", "ja": "木のハンマーで なにを こわせますか?", "clip_start": 365.6, "clip_end": 377.0, "choices": ["back walls", "stars", "torches", "chairs"], "answer": 0}, {"kind": "mc", "q": "How many torches did he make?", "ja": "たいまつを いくつ つくりましたか?", "clip_start": 433.5, "clip_end": 445.0, "choices": ["45", "54", "652", "2"], "answer": 1}, {"kind": "order", "q": "Put the words in order.", "ja": "ことばを ただしい じゅんばんに ならべよう。", "clip_start": 503.5, "clip_end": 516.0, "text": "I'll build a wall right here."}]}, {"time": 904.6, "questions": [{"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 609.0, "clip_end": 616.0, "text": "I can summon a slime with this staff."}, {"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 643.5, "clip_end": 650.0, "text": "Oh, I love my slime."}, {"kind": "answer", "q": "What does the player plant? (acorns)", "ja": "プレイヤーはなにをうえますか?", "clip_start": 643.5, "clip_end": 665.0, "accept": ["acorns", "acorn", "trees", "a corns"]}, {"kind": "answer", "q": "Who is Harold? He is a ...?", "ja": "ハロルドはだれ? (しょうにん)", "clip_start": 725.8, "clip_end": 740.0, "accept": ["merchant", "a merchant", "the merchant"]}, {"kind": "mc", "q": "What did the slime kill?", "ja": "スライムはなにをたおしましたか?", "clip_start": 632.7, "clip_end": 645.0, "choices": ["A demon eye", "A bomb", "A chest", "A tree"], "answer": 0}, {"kind": "order", "q": "Put the words in order.", "ja": "ならべかえてね。", "clip_start": 696.7, "clip_end": 704.0, "text": "There's a zombie on the roof."}, {"kind": "mc", "q": "What was in the chest?", "ja": "たからばこにはなにがはいっていた?", "clip_start": 767.5, "clip_end": 778.7, "choices": ["An umbrella", "A slime staff", "A pickaxe", "A star"], "answer": 0}, {"kind": "answer", "q": "What can the player do with the umbrella? Jump and ...?", "ja": "かさでなにができる? (うく)", "clip_start": 782.4, "clip_end": 797.0, "accept": ["float", "flow", "floats"]}, {"kind": "mc", "q": "What do the recall potions do?", "ja": "リコールポーションはなにをする?", "clip_start": 826.1, "clip_end": 838.0, "choices": ["Take you back home", "Make you jump", "Kill zombies", "Grow trees"], "answer": 0}]}, {"time": 1203.7, "questions": [{"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 1121.5, "clip_end": 1129.0, "text": "This is my shark."}, {"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 1076.0, "clip_end": 1084.0, "text": "I need to find more life crystals."}, {"kind": "answer", "q": "What did he find that is yellow? He found some ...", "ja": "きいろいものをみつけたよ。なにをみつけた?", "clip_start": 980.6, "clip_end": 995.0, "accept": ["gold", "gold ore", "golden"]}, {"kind": "answer", "q": "What animal statue did he pick up?", "ja": "どのどうぶつのぞうをひろった?", "clip_start": 953.3, "clip_end": 970.0, "accept": ["duck", "a duck", "duck statue", "a duck statue", "dock"]}, {"kind": "answer", "q": "What is floating in a bubble?", "ja": "あわのなかでういているのはなに?", "clip_start": 1118.7, "clip_end": 1130.0, "accept": ["shark", "a shark", "shark pup", "my shark"]}, {"kind": "mc", "q": "What did he throw in the hole?", "ja": "あなになにをなげた?", "clip_start": 902.0, "clip_end": 915.0, "choices": ["A bomb", "A ball", "A shark", "A duck"], "answer": 0}, {"kind": "mc", "q": "How much health did he have after using one life crystal?", "ja": "ライフクリスタルをひとつつかうと、たいりょくはいくつ?", "clip_start": 1049.1, "clip_end": 1066.0, "choices": ["100", "120", "140", "160"], "answer": 1}, {"kind": "mc", "q": "What can he do with the breathing rod?", "ja": "いきをするぼうでなにができる?", "clip_start": 1090.3, "clip_end": 1108.0, "choices": ["Breathe underwater", "Fly in the sky", "Make gold", "Dig very fast"], "answer": 0}, {"kind": "order", "q": "Put the words in order.", "ja": "ことばをただしいじゅんばんにならべよう。", "clip_start": 1104.2, "clip_end": 1110.0, "text": "I can hit people with the breathing rod."}]}, {"time": 1326.4, "questions": [{"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 1204.0, "clip_end": 1210.0, "text": "I'll place these chests in this room."}, {"kind": "answer", "q": "What does he want to build at the end? He wants to build a ...", "ja": "さいごになにをつくりたいといっていますか?", "clip_start": 1219.5, "clip_end": 1232.0, "accept": ["sign", "a sign", "sine", "sign."]}, {"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 1252.3, "clip_end": 1258.0, "text": "I'll place my wooden walls."}, {"kind": "answer", "q": "Where does he go up to? He goes up on the ...", "ja": "どこにのぼりましたか?", "clip_start": 1232.3, "clip_end": 1242.0, "accept": ["roof", "the roof", "room", "rooftop"]}, {"kind": "answer", "q": "What did he run out of?", "ja": "なにがなくなりましたか?", "clip_start": 1242.3, "clip_end": 1252.0, "accept": ["wood", "would", "the wood", "wooden"]}, {"kind": "mc", "q": "How many chests does he have?", "ja": "チェストはいくつありますか?", "clip_start": 1200.5, "clip_end": 1212.0, "choices": ["One", "Two", "Three", "Four"], "answer": 1}, {"kind": "mc", "q": "What will he type on the signs?", "ja": "かんばんになにをかきますか?", "clip_start": 1263.4, "clip_end": 1275.0, "choices": ["Names of his friends", "Names of his supporters", "Names of potions", "Names of countries"], "answer": 1}, {"kind": "order", "q": "Put the words in order.", "ja": "ことばをならべかえよう。", "clip_start": 1224.3, "clip_end": 1230.0, "text": "I want to build a sign."}, {"kind": "repeat", "q": "Say this line.", "ja": "このせりふをいってみよう。", "clip_start": 1317.5, "clip_end": 1324.0, "text": "I will see you in the next video."}]}]};
const PASS_RATIO = 0.85;   // まねして いう：6語以下は全部、7語以上は1語までミスOK
const MAX_SAY = 2;         // いってみよう：2回まで（おてほんは見ずに）
const MAX_REPEAT = 3;      // まねして いう：3回まで
const REST_EVERY = 3;      // 3問に1回 ひとやすみ（まねして いう）
const PENDING_KEY = 'mm_pending';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const words = s => String(s).toLowerCase().replace(/[\u2019]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let player = null, ready = false, mode = 'start', bi = 0, quiz = null, clip = null, rec = null, marksDrawn = false;
let stars = 0;
try { stars = parseInt(localStorage.getItem('mm_stars') || '0', 10) || 0; } catch (e) {}
$('stars').textContent = stars;
function addStar() { stars++; $('stars').textContent = stars; try { localStorage.setItem('mm_stars', String(stars)); } catch (e) {} }

// 言えなかった表現を「べつの ばめん」で出し直すためのストック（動画をまたいで残る）
function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; } }
function savePending(list) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list.slice(-20))); } catch (e) {} }

function show(html) { $('card').innerHTML = html; $('ov').hidden = false; }
function hide() { $('ov').hidden = true; }

// ---------- はじめ ----------
if (!DATA || !DATA.breaks) {
  show('<div class="center"><p class="big">クイズが まだ ありません</p><p class="ja">subquiz.py で このファイルを つくると、どうがと クイズが はいります。</p></div>');
} else if (location.protocol === 'file:') {
  show('<div class="center"><p class="big">このままでは うごきません</p><p class="ja">パソコンで ファイルを ちょくせつ ひらくと、どうがと マイクが つかえません。GitHub Pages など https の ばしょに おいてから ひらいてね。</p></div>');
} else if (!SR) {
  show('<div class="center"><p class="big">こえが つかえません</p><p class="ja">この アプリは こえで こたえます。iPad の Safari で ひらいてね。</p></div>');
} else {
  $('title').textContent = DATA.title || 'みてまなぶ';
  DATA.breaks.sort((a, b) => a.time - b.time);
  show('<div class="center"><p class="big">' + esc(DATA.title || '') + '</p>' +
    '<p class="ja">5ふんごとに クイズが でるよ。えいごで いってみよう！</p>' +
    '<button class="btn btn-orange" data-act="start" style="font-size:24px;min-height:64px;padding:0 44px">はじめる</button></div>');
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('yt', {
    videoId: DATA.videoId,
    playerVars: { controls: 0, rel: 0, playsinline: 1, fs: 0, disablekb: 1, iv_load_policy: 3, modestbranding: 1, cc_load_policy: 1, cc_lang_pref: 'en', origin: location.origin },
    events: {
      onReady: () => { ready = true; $('next').textContent = 'はじめるを おしてね'; },
      onStateChange: onState
    }
  });
};

function onState(e) {
  const playing = e.data === 1;
  $('playIcon').innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>' : '<path d="M8 5v14l11-7z" fill="currentColor"/>';
  $('playBtn').setAttribute('aria-label', playing ? 'とめる' : 'さいせい');
  if (e.data === 0) {
    if (mode === 'clip') return endClip();
    if (mode === 'watch') { if (DATA.breaks[bi]) openQuiz(DATA.breaks[bi]); else endScreen(); }
  }
}

setInterval(() => {
  if (!ready || !player.getCurrentTime) return;
  const t = player.getCurrentTime(), d = player.getDuration() || 0;
  if (d) {
    $('fill').style.width = Math.min(100, t / d * 100) + '%';
    if (!marksDrawn) {
      marksDrawn = true;
      $('marks').innerHTML = DATA.breaks.map((b, i) => '<div class="mark" id="mk' + i + '" style="left:' + Math.min(100, b.time / d * 100) + '%"></div>').join('');
    }
  }
  if (mode === 'watch') {
    const b = DATA.breaks[bi];
    if (b) {
      $('next').textContent = 'つぎの クイズまで ' + fmt(b.time - t);
      if (t >= b.time) { player.pauseVideo(); openQuiz(b); }
    } else $('next').textContent = 'さいごまで みよう';
  }
  if (mode === 'clip' && clip && t >= clip.end) endClip();
}, 250);

$('playBtn').onclick = () => {
  if (!ready || mode !== 'watch') return;
  player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
};
$('shield').onclick = $('playBtn').onclick;
$('backBtn').onclick = () => { if (ready && mode === 'watch') player.seekTo(Math.max(0, player.getCurrentTime() - 10), true); };

// ---------- クイズの組み立て ----------
// 並び：いってみよう ×(REST_EVERY-1) → まねして いう ×1 → くりかえし。
// 最初に、前に言えなかった表現の「べつの ばめん」を最大2問入れる。
function buildQueue(b) {
  const says = shuffle(b.questions.filter(q => q.kind === 'say'));
  const reps = shuffle(b.questions.filter(q => q.kind === 'repeat'));
  const pending = loadPending();
  const applies = pending.splice(0, 2).map(a => Object.assign({ kind: 'say', isApply: true }, a));
  savePending(pending);
  const out = applies.slice();
  let si = 0, ri = 0;
  while (si < says.length || ri < reps.length) {
    for (let k = 0; k < REST_EVERY - 1 && si < says.length; k++) out.push(says[si++]);
    if (ri < reps.length) out.push(reps[ri++]);
  }
  return out;
}

function fresh(q) { return { q, tries: 0, status: null, heard: null, hits: null, listening: false, heardModel: false, follow: false }; }

function openQuiz(b) {
  mode = 'quiz';
  const queue = buildQueue(b);
  if (!queue.length) { bi++; mode = 'watch'; player.playVideo(); return; }
  quiz = { b, queue, idx: 0, good: 0, goal: Math.min(DATA.goal || 5, queue.length) };
  nextQuestion();
}

function nextQuestion() {
  if (quiz.idx >= quiz.queue.length) { quiz.queue = buildQueue(quiz.b); quiz.idx = 0; }
  quiz.cur = fresh(quiz.queue[quiz.idx++]);
  render();
}

// 言えなかった「いってみよう」を、おてほんを まねする問題に切りかえる
function toFollow(c) {
  const f = fresh({ kind: 'repeat', text: c.q.model, clip_start: c.q.clip_start, clip_end: c.q.clip_end });
  f.follow = true;
  return f;
}

// ---------- 画面 ----------
function render() {
  const c = quiz.cur, q = c.q, say = q.kind === 'say';
  const max = say ? MAX_SAY : MAX_REPEAT;
  const hasClip = q.clip_start != null;
  let label, lcls = 'badge';
  if (c.follow) { label = 'おてほんを まねしよう'; lcls = 'kind'; }
  else if (say && q.isApply) label = 'べつの ばめんで いってみよう';
  else if (say) label = 'いってみよう';
  else { label = 'ひとやすみ ・ まねして いう'; lcls = 'kind'; }

  let h = '<div class="row"><span class="' + lcls + '">' + label + '</span>' +
    '<div class="row" style="gap:10px"><span class="ja" style="margin:0">クリアまで</span><div class="dots">' +
    Array.from({ length: quiz.goal }, (_, i) => '<div class="dot' + (i < quiz.good ? ' on' : '') + '"></div>').join('') + '</div></div></div>';

  if (say) {
    h += '<div><p class="ja" lang="en" style="margin:0 0 4px">Say it in English!</p><p class="q">' + esc(q.ja) + '</p></div>';
  } else {
    h += '<div><p class="ja" lang="en" style="margin:0 0 4px">Say it like the video!</p></div><div class="prompt" lang="en">\u201c' + esc(q.text) + '\u201d</div>';
  }

  if (c.heard !== null && !c.listening) {
    if (say) {
      h += '<div class="chips" lang="en"><span class="chip ' + (c.status === 'right' ? 'ok' : 'ng') + '">' + (c.heard ? esc(c.heard) : '（きこえなかったよ）') + '</span></div>';
    } else {
      h += '<div class="chips" lang="en">' + q.text.split(' ').map((w, i) => '<span class="chip ' + (c.hits[i] ? 'ok' : 'ng') + '">' + esc(w) + '</span>').join('') + '</div>';
      h += '<div class="heard" lang="en">きこえた ことば：' + (c.heard ? esc(c.heard) : '（きこえなかったよ）') + '</div>';
    }
  }
  if (say && c.status === 'right') {
    h += '<div class="msg" style="background:#F1F7EE;color:#3F6212;justify-content:flex-start"><span>どうがでの いいかた</span><span lang="en" style="color:var(--ink);font-size:22px">' + esc(q.model) + '</span></div>';
  }

  if (!c.status) {
    let txt = 'タップして えいごで はなそう', warn = false;
    if (c.listening) txt = 'きいているよ… いいおわったら タップ';
    else if (c.tries > 0 && say) { warn = true; txt = 'つたわらなかったみたい。いいかたを かえて もういちど（' + c.tries + '/' + max + '）'; }
    else if (c.tries > 0) {
      warn = true;
      const missed = q.text.split(' ').filter((w, i) => !c.hits[i]);
      txt = (missed.length ? '\u201c' + missed.join('\u201d \u201c') + '\u201d を きをつけて ' : '') + 'もういちど（' + c.tries + '/' + max + '）';
    }
    h += '<div class="mic-wrap"><div class="ring' + (c.listening ? ' on' : '') + '"><button class="mic" data-act="mic" aria-label="' + (c.listening ? 'はなし おわった' : 'タップして はなす') + '">' +
      '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>' +
      '</button></div><div class="mic-text' + (warn ? ' warn' : '') + '">' + esc(txt) + '</div></div>';

    // いってみよう は1回言うまで おてほん なし。まねして いう は いつでも きける
    if (!c.listening && hasClip && (!say || c.tries > 0)) {
      h += '<div class="row" style="justify-content:center"><button class="btn btn-soft" data-act="hint">' +
        fmt(q.clip_start) + ' の おてほんを きく' + (say ? '（きくと カウントなし）' : '') + '</button></div>';
    }
  }
  if (c.status === 'wrong') {
    if (say) {
      h += '<div class="msg ng"><span>むずかしかったね。おてほんを まねしてみよう</span><button class="btn btn-red" data-act="model">' +
        (hasClip ? fmt(q.clip_start) + ' の おてほんを みる' : 'おてほんを みる') + '</button></div>';
    } else {
      h += '<div class="msg ng"><span>おしい！ おてほんを きいてから もういちど</span><button class="btn btn-red" data-act="retryRepeat">' +
        (hasClip ? fmt(q.clip_start) + ' の おてほんを きく' : 'もういちど') + '</button></div>';
    }
  }
  if (c.status === 'right') {
    let m;
    if (c.follow) m = 'いえたね！ この いいかたは べつの ばめんで また でるよ';
    else if (c.heardModel) m = 'いえたね！ おてほんを きいたので カウントは なし';
    else if (say) m = 'Nice! じぶんの ことばで つたわったね';
    else m = 'Nice! まねして いえたね';
    h += '<div class="msg ok"><span>' + m + '</span><button class="btn btn-blue" data-act="next">つぎへ</button></div>';
  }
  show(h);
}

// ---------- 判定 ----------
function judge(alts) {
  const c = quiz.cur, q = c.q, say = q.kind === 'say';
  c.tries++;
  let pass = false;
  if (say) {
    c.heard = alts[0] || '';
    pass = alts.some(a => { const hw = ' ' + words(a).join(' ') + ' '; return q.accept.some(x => hw.includes(' ' + words(x).join(' ') + ' ')); });
  } else {
    const tokens = q.text.split(' ');
    const owner = [], target = [];
    tokens.forEach((tk, ti) => words(tk).forEach(w => { target.push(w); owner.push(ti); }));
    let best = null, bestN = -1;
    (alts.length ? alts : ['']).forEach(a => {
      const hw = words(a); let p = 0;
      const hits = target.map(t => { const k = hw.indexOf(t, p); if (k >= 0) { p = k + 1; return true; } return false; });
      const n = hits.filter(Boolean).length;
      if (n > bestN) { bestN = n; best = { a, hits }; }
    });
    // 画面の単語（句読点つき）ごとに、中の単語がぜんぶ聞き取れたかで色分け
    c.hits = tokens.map((tk, ti) => target.every((w, k) => owner[k] !== ti || best.hits[k]));
    c.heard = best.a;
    pass = bestN / target.length >= PASS_RATIO;
  }
  const max = say ? MAX_SAY : MAX_REPEAT;
  if (pass) {
    c.status = 'right';
    if (!c.follow && !c.heardModel) { quiz.good++; addStar(); }
  } else if (c.tries >= max) c.status = 'wrong';

  // 自力で言えなかった表現は、べつの ばめんの問題をストックしておく
  if (say && !c.follow && (c.status === 'wrong' || (pass && c.heardModel)) && q.apply && q.apply.length) {
    const p = loadPending();
    q.apply.forEach(a => p.push({ ja: a.ja, model: a.model, accept: a.accept, apply: [] }));
    savePending(p);
  }
}

function startListening() {
  const c = quiz.cur;
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
  let got = null;
  rec.onresult = e => { got = Array.from(e.results[0]).map(a => a.transcript); };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') got = 'denied'; };
  rec.onend = () => {
    rec = null; c.listening = false;
    if (got === 'denied') {
      show('<div class="center"><p class="big">マイクが つかえません</p><p class="ja">iPad の せってい → Safari → マイク を「許可」にして、ページを ひらきなおしてね。</p><button class="btn btn-blue" data-act="back">クイズに もどる</button></div>');
      return;
    }
    judge(got || []);
    render();
  };
  c.listening = true;
  render();
  try { rec.start(); } catch (e) { c.listening = false; render(); }
}

// ---------- おてほん（動画の場面）を流す ----------
function playClip(after) {
  const q = quiz.cur.q;
  if (q.clip_start == null) { afterClip(after); render(); return; }
  clip = { start: q.clip_start, end: q.clip_end, after };
  mode = 'clip'; hide();
  $('cliptag').hidden = false;
  player.seekTo(clip.start, true);
  player.playVideo();
}
function afterClip(after) {
  const c = quiz.cur;
  if (after === 'hint') c.heardModel = c.heardModel || c.q.kind === 'say';
  if (after === 'model') quiz.cur = toFollow(c);
  if (after === 'retryRepeat') { const f = fresh(c.q); f.follow = c.follow; f.heardModel = true; quiz.cur = f; }
}
function endClip() {
  player.pauseVideo();
  $('cliptag').hidden = true;
  mode = 'quiz';
  afterClip(clip.after);
  clip = null;
  render();
}

function clearScreen() {
  const m = $('mk' + bi); if (m) m.classList.add('done');
  show('<div class="center"><div class="row" style="justify-content:center">' +
    '<svg width="70" height="70" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#F5B300"/></svg>'.repeat(3) +
    '</div><p class="big">Great job! クリア！</p><button class="btn btn-orange" data-act="resume" style="font-size:24px;min-height:64px;padding:0 44px">つづきを みる</button></div>');
}
function endScreen() {
  mode = 'end';
  show('<div class="center"><p class="big">おしまい！</p><p class="ja">あつめた ほし：' + stars + '</p><button class="btn btn-blue" data-act="again">さいしょから みる</button></div>');
}

// ---------- ボタン ----------
$('card').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const c = quiz && quiz.cur;
  switch (btn.dataset.act) {
    case 'start': if (!ready) return; hide(); mode = 'watch'; player.playVideo(); break;
    case 'mic': if (c.status) return; if (c.listening) { if (rec) rec.stop(); } else startListening(); break;
    case 'hint': playClip('hint'); break;
    case 'model': playClip('model'); break;
    case 'retryRepeat': playClip('retryRepeat'); break;
    case 'back': render(); break;
    case 'next': if (quiz.good >= quiz.goal) clearScreen(); else nextQuestion(); break;
    case 'resume':
      bi++; mode = 'watch'; hide();
      if (player.getPlayerState() === 0 || player.getCurrentTime() >= player.getDuration() - 0.5) {
        if (DATA.breaks[bi]) openQuiz(DATA.breaks[bi]); else endScreen();
      } else player.playVideo();
      break;
    case 'again':
      bi = 0; mode = 'watch'; hide();
      document.querySelectorAll('.mark.done').forEach(m => m.classList.remove('done'));
      player.seekTo(0, true); player.playVideo(); break;
  }
});
</script>
